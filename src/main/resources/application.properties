spring.application.name=Dawson_Bungalow
spring.mongodb.uri=${spring.mongodb.uri}
spring.mongodb.database=DawsonBungalowDB

# JWT
jwt.secret=${jwt.secret}
jwt.expiration=86400000

# Base URL - CRITICAL for image URLs
app.base-url=https://dawsonbunglow-production-1022.up.railway.app

# GridFS / Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Pinecone
pinecone.api-key=${pinecone.api-key}
pinecone.index=dawsonbungalow
pinecone.index-url=https://dawsonbungalow-3nq03gf.svc.aped-4627-b74a.pinecone.io

# Groq
groq.api-key=${groq.api-key}
groq.model=llama-3.3-70b-versatile
